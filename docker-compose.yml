# Production-like stack: web (Next standalone) + api (Nest) + postgres.
# Copy .env.example to .env and set POSTGRES_PASSWORD and JWT_SECRET first.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: domar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: domar
    volumes:
      - domar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U domar"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://domar:${POSTGRES_PASSWORD}@postgres:5432/domar?schema=public
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      UPLOADS_DIR: /uploads
      WEB_URL: ${WEB_URL:-http://localhost:8080}
      # only set to false while testing over plain HTTP
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # optional: extra origins allowed to call the API cross-origin (comma-separated)
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # optional: Firebase service-account JSON; enables push to the worker app
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
      NODE_ENV: production
    volumes:
      - domar_uploads:/uploads
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:3001
    ports:
      - "8080:3000"
    depends_on:
      - api

volumes:
  domar_pgdata:
  domar_uploads:
